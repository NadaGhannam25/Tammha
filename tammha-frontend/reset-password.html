<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>/* Interface language (Arabic RTL / English LTR), set before the page draws. */try{if(localStorage.getItem('tammha-settings-language')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Reset password">إعادة تعيين كلمة المرور</title><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/><link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png"/><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
  <link rel="stylesheet" href="style.css?v=qa33" />
<link href="ltr.css?v=qa33" rel="stylesheet"/>
<link href="loader.css?v=qa33" rel="stylesheet"/>
<script src="i18n-en.js?v=qa33"></script>
<script src="i18n.js?v=qa33"></script>
<script src="loader.js?v=qa33"></script>
<link href="app.css?v=qa33" rel="stylesheet"/>
</head>
<body class="auth-flow-page auth-page-reset">
  <div class="auth-flow-shell">
    <header class="auth-flow-header">
      <a class="auth-flow-logo" href="login.html" aria-label="تممها"><img src="assets/tammha-auth-logo.png" alt="شعار تممها" /></a>
    </header>

    <main class="auth-flow-main">
      <section class="auth-flow-card auth-flow-card--reset">
        <h1 class="auth-flow-title" data-activate-text="تفعيل حساب المشرف">إعادة تعيين كلمة المرور</h1>
        <p class="auth-flow-subtitle" data-activate-text="أنشأت إدارة الجامعة حسابك. اختر كلمة مرور لتفعيله.">أدخل كلمة المرور الجديدة لحسابك.</p>

        <form class="auth-flow-form" id="resetPasswordForm" novalidate>
          <div class="auth-field">
            <label for="newPassword">كلمة المرور الجديدة</label>
            <div class="auth-input-wrap">
              <input class="auth-input" id="newPassword" type="password" autocomplete="new-password" />
              <button class="auth-password-toggle" type="button" data-password-toggle="newPassword" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور"><img src="assets/eye-toggle.png" alt="" /></button>
            </div>
          </div>
          <div class="auth-field">
            <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
            <div class="auth-input-wrap">
              <input class="auth-input" id="confirmPassword" type="password" autocomplete="new-password" />
              <button class="auth-password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور"><img src="assets/eye-toggle.png" alt="" /></button>
            </div>
          </div>

          <ul class="auth-requirements" aria-label="شروط كلمة المرور">
            <li class="auth-requirement" data-rule="length">8 أحرف على الأقل</li>
            <li class="auth-requirement" data-rule="case">تحتوي على حرف واحد على الأقل</li>
            <li class="auth-requirement" data-rule="number">تحتوي على رقم واحد على الأقل</li>
          </ul>
          <p class="auth-error" id="resetPasswordError" aria-live="polite"></p>
          <button class="auth-primary-button" data-activate-text="تفعيل الحساب" type="submit">تحديث كلمة المرور</button>
        </form>
      </section>
    </main>

    <footer class="auth-flow-footer">جميع الحقوق محفوظة لتممها ©2026</footer>
  </div>
  <script>
    // reset-password.html?mode=activate&token=… : the supervisor activation link (same form, other wording).
    if (new URLSearchParams(location.search).get('mode') === 'activate') {
      document.querySelectorAll('[data-activate-text]').forEach((el) => { el.textContent = el.dataset.activateText; });
      document.title = 'تممها | تفعيل حساب المشرف';
    }
  </script>
  <script src="config.js?v=qa33"></script><script src="api.js?v=qa33"></script><script src="auth-flow.js?v=qa33"></script>
</body>
</html>
