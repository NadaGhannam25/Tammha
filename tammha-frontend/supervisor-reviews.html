<section class="projects-hero page-banner--compact sv-banner"><div class="projects-hero__content"><h1 data-en="Reviews">المراجعات</h1><p data-en="This area is for following the work submitted by the teams and recording academic feedback that helps develop the project outputs and improve their quality.">تُخصص هذه المساحة لمتابعة الأعمال المقدمة من الفرق، وتوثيق الملاحظات الأكاديمية التي تساعد على تطوير مخرجات المشروع وتحسين جودتها.</p></div></section>
<section class="projects-toolbar sv-toolbar"><div aria-label="حالة المراجعة" class="project-filters" data-en-aria-label="Review status" role="tablist">
<button aria-selected="true" class="project-filter is-active" data-review-filter="pending" role="tab" type="button"><span data-en="Waiting for review">بانتظار المراجعة</span> <span data-count></span></button><button aria-selected="false" class="project-filter" data-review-filter="changes" role="tab" type="button"><span data-en="Changes requested">مطلوب تعديل</span> <span data-count></span></button><button aria-selected="false" class="project-filter" data-review-filter="approved" role="tab" type="button"><span data-en="Approved">معتمدة</span> <span data-count></span></button><button aria-selected="false" class="project-filter" data-review-filter="all" role="tab" type="button"><span data-en="All">الكل</span> <span data-count></span></button>
</div><label class="sv-select"><span class="visually-hidden" data-en="Project">المشروع</span><select id="svReviewProject"></select></label></section>
<section aria-live="polite" id="svReviewTable"></section>
<footer class="footer projects-footer" data-en="All rights reserved © Tammha 2026">جميع الحقوق محفوظة لتممها ©2026</footer>

<!-- Shared: details drawer (task details, file review, meeting summary) -->
<div class="task-drawer" hidden id="svDrawer">
<aside aria-labelledby="svDrawerTitle" aria-modal="true" class="task-drawer__panel" role="dialog">
<div class="task-drawer__head"><div><span class="task-drawer__project" id="svDrawerKicker"></span><h2 id="svDrawerTitle"></h2></div><button aria-label="إغلاق" class="task-drawer__close" data-en-aria-label="Close" id="svDrawerClose" type="button">×</button></div>
<div class="task-drawer__body" id="svDrawerBody"></div>
</aside>
</div>

<!-- Shared: feedback -->
<div class="meeting-modal" hidden id="svFeedbackModal">
<div aria-labelledby="fbHeading" aria-modal="true" class="meeting-modal__dialog" role="dialog">
<button aria-label="إغلاق" class="meeting-modal__close" data-close-feedback data-en-aria-label="Close" type="button">×</button>
<div class="meeting-modal__heading"><h2 data-en="New feedback" id="fbHeading">ملاحظة جديدة</h2><p data-en="The team sees it as new feedback in the project.">تظهر للفريق كملاحظة جديدة في المشروع.</p></div>
<form class="meeting-modal__form" id="fbForm" novalidate>
<div class="meeting-create-grid">
<label><span data-en="Project">المشروع</span><select id="fbProject"></select></label>
<label><span data-en="About">تتعلق بـ</span><select id="fbScope"><option data-en="The project" value="PROJECT">المشروع</option><option data-en="A task" value="TASK">مهمة</option></select></label>
<label hidden id="fbTaskWrap"><span data-en="Task">المهمة</span><select id="fbTask"></select></label>
<label><span data-en="Related file">ملف مرتبط</span><select id="fbFile"></select></label>
<label class="meeting-create-full"><span data-en="Feedback">الملاحظة</span><textarea id="fbText" rows="4"></textarea><small class="field-error" data-en="Write the feedback first" hidden id="fbTextError">اكتب الملاحظة أولًا</small></label>
</div>
<div class="meeting-modal__actions"><button class="meeting-modal__cancel" data-close-feedback data-en="Cancel" type="button">إلغاء</button><button class="meeting-modal__submit" data-en="Send feedback" type="submit">إرسال الملاحظة</button></div>
</form>
</div>
</div>

<!-- Shared: confirmation -->
<div class="meeting-modal sv-confirm" hidden id="svConfirm">
<div aria-labelledby="svConfirmTitle" aria-modal="true" class="meeting-modal__dialog sv-confirm__dialog" role="alertdialog">
<div class="meeting-modal__heading"><h2 id="svConfirmTitle"></h2><p id="svConfirmText"></p></div>
<label class="sv-confirm__reason" hidden id="svConfirmReasonWrap"><span data-en="Reason (optional)">السبب (اختياري)</span><textarea id="svConfirmReason" rows="2"></textarea></label>
<div class="meeting-modal__actions"><button class="meeting-modal__cancel" data-en="Back" id="svConfirmCancel" type="button">تراجع</button><button class="meeting-modal__submit sv-danger" id="svConfirmOk" type="button"></button></div>
</div>
