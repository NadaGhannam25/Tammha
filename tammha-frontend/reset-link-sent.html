<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>/* Interface language (Arabic RTL / English LTR), set before the page draws. */try{if(localStorage.getItem('tammha-settings-language')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Reset link sent">تم إرسال رابط إعادة التعيين</title><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/><link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png"/><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
  <link rel="stylesheet" href="style.css?v=qa38" />
<link href="ltr.css?v=qa38" rel="stylesheet"/>
<link href="loader.css?v=qa38" rel="stylesheet"/>
<script src="i18n-en.js?v=qa38"></script>
<script src="i18n.js?v=qa38"></script>
<script src="loader.js?v=qa38"></script>
<link href="app.css?v=qa38" rel="stylesheet"/>
</head>
<body class="auth-flow-page auth-page-sent">
  <div class="auth-flow-shell">
    <header class="auth-flow-header">
      <a class="auth-flow-logo" href="login.html" aria-label="تممها"><img src="assets/tammha-auth-logo.png" alt="شعار تممها" /></a>
    </header>

    <main class="auth-flow-main">
      <section class="auth-flow-card auth-flow-card--center">
        <div class="auth-flow-visual">
          <img src="assets/reset-email.png" alt="تم إرسال البريد الإلكتروني" />
        </div>
        <h1 class="auth-flow-title">تم إرسال رابط إعادة التعيين</h1>
        <p class="auth-flow-subtitle">تم إرسال رابط إعادة تعيين كلمة المرور إلى</p>
        <div class="auth-email-value" data-reset-email dir="ltr"></div>
        <p class="auth-flow-note">يرجى التحقق من بريدك الإلكتروني، بما في ذلك مجلد الرسائل غير المرغوب فيها، للحصول على الرسالة خلال دقائق.</p>
        <div class="auth-flow-actions auth-flow-actions--single">
          <a class="auth-secondary-button" href="login.html">العودة إلى تسجيل الدخول</a>
        </div>
        <div class="auth-helper-row">
          <span>لم يصلك البريد؟</span>
          <button class="auth-text-link" id="resendResetLink" type="button">إعادة الإرسال</button>
          <strong id="resendTimer" dir="ltr">00:58</strong>
        </div>
      </section>
    </main>

    <footer class="auth-flow-footer">جميع الحقوق محفوظة لتممها ©2026</footer>
  </div>
  <script src="config.js?v=qa38"></script><script src="api.js?v=qa38"></script><script src="auth-flow.js?v=qa38"></script>
</body>
</html>
