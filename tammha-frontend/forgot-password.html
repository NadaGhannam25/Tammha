<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>/* Interface language (Arabic RTL / English LTR), set before the page draws. */try{if(localStorage.getItem('tammha-settings-language')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Forgot password">نسيت كلمة المرور</title><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/><link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png"/><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
  <link rel="stylesheet" href="style.css?v=qa32" />
<link href="ltr.css?v=qa32" rel="stylesheet"/>
<link href="loader.css?v=qa32" rel="stylesheet"/>
<script src="i18n-en.js?v=qa32"></script>
<script src="i18n.js?v=qa32"></script>
<script src="loader.js?v=qa32"></script>
<link href="app.css?v=qa32" rel="stylesheet"/>
</head>
<body class="auth-flow-page auth-page-forgot">
  <div class="auth-flow-shell">
    <header class="auth-flow-header">
      <a class="auth-flow-logo" href="login.html" aria-label="تممها"><img src="assets/tammha-auth-logo.png" alt="شعار تممها" /></a>
    </header>

    <main class="auth-flow-main">
      <section class="auth-flow-card auth-flow-card--compact">
        <div class="auth-flow-visual auth-flow-visual--small">
          <img src="assets/reset-lock.png" alt="رمز حماية كلمة المرور" />
        </div>
        <h1 class="auth-flow-title">هل نسيت كلمة المرور؟</h1>
        <p class="auth-flow-subtitle">أدخل بريدك الإلكتروني، وسنرسل لك رابطًا آمنًا لإعادة تعيين كلمة المرور.</p>

        <form class="auth-flow-form" id="forgotPasswordForm" novalidate>
          <div class="auth-field">
            <label for="resetEmail">البريد الإلكتروني</label>
            <input class="auth-input" id="resetEmail" name="email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr" />
            <p class="auth-error" id="resetEmailError" aria-live="polite"></p>
          </div>
          <button class="auth-primary-button" type="submit">إرسال رابط إعادة التعيين</button>
        </form>
        <div class="auth-helper-row">
          <span>هل تذكرت كلمة المرور؟</span>
          <a class="auth-text-link" href="login.html">العودة إلى تسجيل الدخول</a>
        </div>
      </section>
    </main>

    <footer class="auth-flow-footer">جميع الحقوق محفوظة لتممها ©2026</footer>
  </div>
  <script src="config.js?v=qa32"></script><script src="api.js?v=qa32"></script><script src="auth-flow.js?v=qa32"></script>
</body>
</html>
