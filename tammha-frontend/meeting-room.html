<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<script>/* Interface language (Arabic RTL / English LTR), set before the page draws. */try{if(localStorage.getItem('tammha-settings-language')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تممها | الاجتماع</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="supervisor.css">
<link href="ltr.css" rel="stylesheet"/>
<link href="loader.css" rel="stylesheet"/>
<script src="i18n-en.js"></script>
<script src="i18n.js"></script>
<script src="loader.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="session.js"></script>
<script src="domain.js"></script>
<link href="app.css" rel="stylesheet"/>
</head>
<body class="meeting-room-page meeting-room-page--v42" data-app-role="ANY">
<main class="meeting-room-v42-shell">
  <header class="meeting-room-v42-header">
    <div class="meeting-room-v42-title">
      <img src="assets/tammha-mark.png" alt="شعار تممها">
      <div><span>اجتماع</span><h1 id="roomTitle"></h1></div>
    </div>
    <div class="meeting-room-v42-meta"><span class="app-chip app-chip--muted" id="roomConn" role="status">جارٍ الاتصال…</span><b id="roomTime">00:00</b></div>
  </header>

  <!-- Stage on the right; Chat / Participants panel opens on the left and the stage shrinks to make room. -->
  <div class="meeting-room-body" id="roomBody">
    <section class="meeting-room-v42-stage" id="roomStage"></section>
    <div class="app-banner app-banner--error room-error" hidden id="roomError" role="alert"><span id="roomErrorText"></span> <button class="app-btn" id="roomRetry" type="button">إعادة الاتصال</button> <a class="app-btn app-btn--ghost" id="roomBack" href="meetings.html">العودة للاجتماعات</a></div>

    <aside aria-labelledby="roomSideTitle" class="room-side" hidden id="roomSide">
      <div class="room-side__head">
        <h2 id="roomSideTitle">المحادثة</h2>
        <button aria-label="إغلاق اللوحة" class="room-side__close" id="closeRoomSide" type="button">×</button>
      </div>

      <div class="room-side__view room-chat" data-room-view="chat">
        <div class="room-chat__messages" id="roomChatMessages"></div>
        <form class="room-chat__input" id="roomChatForm">
          <input aria-label="اكتب رسالة" id="roomChatText" placeholder="اكتب رسالة..." autocomplete="off">
          <button type="submit">إرسال</button>
        </form>
      </div>

      <div class="room-side__view" data-room-view="people" hidden>
        <ul class="room-people" id="roomPeople"></ul>
      </div>
    </aside>
  </div>

  <footer class="meeting-room-v42-toolbar" aria-label="أدوات الاجتماع">
    <button id="roomMic" type="button" class="meeting-tool is-on" data-device="mic" aria-pressed="true" aria-label="الميكروفون"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"></path></svg><span>المايك</span></button>
    <button id="roomCamera" type="button" class="meeting-tool is-on" data-device="camera" aria-pressed="true" aria-label="الكاميرا"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"></rect><path d="m16 10 5-3v10l-5-3"></path></svg><span>الكاميرا</span></button>
    <button id="roomShare" type="button" class="meeting-tool" aria-label="مشاركة الشاشة"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4M8 10l4-4 4 4M12 6v7"></path></svg><span>مشاركة الشاشة</span></button>
    <span class="meeting-tool-sep" aria-hidden="true"></span>
    <button type="button" class="meeting-tool" data-room-panel="chat" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4V5Z"></path><path d="M8 9h8M8 12h5"></path></svg><span>المحادثة</span></button>
    <button type="button" class="meeting-tool" data-room-panel="people" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19c.7-3.2 2.7-5 5.5-5s4.8 1.8 5.5 5"></path><path d="M15.5 5.5a3 3 0 0 1 0 5.6M17.5 14.3c1.6.6 2.6 2.2 3 4.7"></path></svg><span>المشاركون <small id="roomPeopleCount">0</small></span></button>
    <button id="exitMeeting" type="button" class="meeting-tool meeting-tool--exit"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"></path></svg><span>مغادرة</span></button>
  </footer>
</main>
<script src="vendor/livekit-client/livekit-client.umd.js"></script>
<script src="pages/meeting-room.js"></script>

</body></html>
