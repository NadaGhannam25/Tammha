<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<script>/* Interface language (Arabic RTL / English LTR), set before the page draws. */try{if(localStorage.getItem('tammha-settings-language')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-en="Meeting">الاجتماع</title><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/><link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png"/><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
<link rel="stylesheet" href="style.css?v=qa38">
<link rel="stylesheet" href="supervisor.css?v=qa38">
<link href="ltr.css?v=qa38" rel="stylesheet"/>
<link href="loader.css?v=qa38" rel="stylesheet"/>
<script src="i18n-en.js?v=qa38"></script>
<script src="i18n.js?v=qa38"></script>
<script src="loader.js?v=qa38"></script>
<script src="config.js?v=qa38"></script>
<script src="api.js?v=qa38"></script>
<script src="session.js?v=qa38"></script>
<script src="domain.js?v=qa38"></script>
<link href="app.css?v=qa38" rel="stylesheet"/>
</head>
<body class="meeting-room-page meeting-room-page--v42" data-app-role="ANY">
<main class="meeting-room-v42-shell">
  <header class="meeting-room-v42-header room-head">
    <div class="room-head__brand">
      <img src="assets/tammha-mark.png" alt="شعار تممها" width="40" height="40">
      <span class="room-head__divider" aria-hidden="true"></span>
      <div class="room-head__title"><span data-en="Meeting">اجتماع</span><h1 id="roomTitle"></h1></div>
    </div>
    <div class="room-head__actions">
      <span class="room-head__status visually-hidden" id="roomConn" role="status" data-state="pending">جارٍ الاتصال…</span>
      <b class="room-head__time" id="roomTime" aria-label="مدة الاجتماع">00:00</b>
      <div class="room-leave" id="leaveSplit">
        <button class="room-leave__main" id="exitMeeting" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4.5 14.5c4.6-4 10.4-4 15 0l-2 2.3-3-1.3v-2.2a10 10 0 0 0-5 0v2.2l-3 1.3Z"></path></svg><span data-en="Leave">مغادرة</span></button>
        <button class="room-leave__more" hidden id="leaveMore" type="button" aria-expanded="false" aria-haspopup="true" aria-label="خيارات المغادرة" data-en-aria-label="Leave options"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></button>
        <div class="room-leave__menu" hidden id="leaveMenu" role="menu">
          <button hidden id="endMeeting" role="menuitem" type="button"><span data-en="End meeting">إنهاء الاجتماع</span></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Stage on the right; Chat / Participants panel opens on the left and the stage shrinks to make room. -->
  <div class="meeting-room-body" id="roomBody">
    <section class="meeting-room-v42-stage" id="roomStage"></section>
    <div class="app-banner app-banner--error room-error" hidden id="roomError" role="alert"><span id="roomErrorText"></span> <button class="app-btn" id="roomRetry" type="button">إعادة الاتصال</button> <a class="app-btn app-btn--ghost" id="roomBack" href="meetings.html">العودة للاجتماعات</a></div>

    <aside aria-labelledby="roomSideTitle" class="room-side" hidden id="roomSide">
      <div class="room-side__head">
        <h2 id="roomSideTitle">المحادثة</h2>
        <button aria-label="إغلاق اللوحة" class="room-side__close" id="closeRoomSide" type="button">×</button>
      </div>

      <div class="room-side__view room-chat" data-room-view="chat">
        <div class="room-chat__messages" id="roomChatMessages"></div>
        <form class="room-chat__input" id="roomChatForm">
          <input aria-label="اكتب رسالة" id="roomChatText" placeholder="اكتب رسالة..." autocomplete="off">
          <button type="submit">إرسال</button>
        </form>
      </div>

      <div class="room-side__view" data-room-view="people" hidden>
        <ul class="room-people" id="roomPeople"></ul>
      </div>
    </aside>
  </div>

  <footer class="meeting-room-v42-toolbar" aria-label="أدوات الاجتماع">
    <button id="roomMic" type="button" class="meeting-tool is-on" data-device="mic" aria-pressed="true" aria-label="الميكروفون"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"></path><path class="meeting-tool__slash" d="M4 4l16 16"></path></svg><span data-en="Mic">المايك</span></button>
    <button id="roomCamera" type="button" class="meeting-tool is-on" data-device="camera" aria-pressed="true" aria-label="الكاميرا"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"></rect><path d="m16 10 5-3v10l-5-3"></path><path class="meeting-tool__slash" d="M4 4l16 16"></path></svg><span data-en="Camera">الكاميرا</span></button>
    <button id="roomShare" type="button" class="meeting-tool" data-share aria-pressed="false" aria-label="مشاركة الشاشة"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4M9.5 11 12 8.5l2.5 2.5M12 8.5v5"></path></svg><span>مشاركة الشاشة</span></button>
    <span class="meeting-tool-sep" aria-hidden="true"></span>
    <button type="button" class="meeting-tool" data-room-panel="chat" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4V5Z"></path><path d="M8 9h8M8 12h5"></path></svg><span>المحادثة</span></button>
    <button type="button" class="meeting-tool" data-room-panel="people" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19c.7-3.2 2.7-5 5.5-5s4.8 1.8 5.5 5"></path><path d="M15.5 5.5a3 3 0 0 1 0 5.6M17.5 14.3c1.6.6 2.6 2.2 3 4.7"></path></svg><span>المشاركون <small id="roomPeopleCount">0</small></span></button>
  </footer>
  <div class="room-confirm" hidden id="endDialog">
    <div class="room-confirm__box" role="alertdialog" aria-modal="true" aria-labelledby="endDialogText">
      <p id="endDialogText" data-en="End the meeting for everyone? All participants will be removed and nobody can join again.">إنهاء الاجتماع للجميع؟ سيُخرج جميع المشاركين ولن يمكن الانضمام إليه مرة أخرى.</p>
      <div class="room-confirm__actions">
        <button class="room-confirm__cancel" id="endCancel" type="button" data-en="Cancel">إلغاء</button>
        <button class="room-confirm__ok" id="endConfirm" type="button" data-en="End meeting">إنهاء الاجتماع</button>
      </div>
    </div>
  </div>
</main>
<script src="vendor/livekit-client/livekit-client.umd.js?v=qa38"></script>
<script src="pages/meeting-room.js?v=qa38"></script>

</body></html>
