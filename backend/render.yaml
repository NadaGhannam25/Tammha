# Render Blueprint — Tammha backend (NestJS + Prisma + Supabase PostgreSQL)
# Dashboard > New > Blueprint > select this repository. Render reads this file.
#
# Secrets use `sync: false`: Render asks for them in the Dashboard when the Blueprint
# is created (they are NEVER stored in this file). JWT_SECRET is generated by Render.
# Full guide: docs/STAGE_P15_RENDER_DEPLOYMENT.md
services:
  - type: web
    name: tammha-api
    runtime: node
    # Pick the region closest to your Supabase project (eu-central-1 = frankfurt).
    # Cannot be changed after creation.
    region: singapore
    # Paid 0.5 CPU / 512 MB plan: never sleeps and supports preDeployCommand.
    # Free plan: set `plan: free`, delete preDeployCommand and set MIGRATE_ON_START=true below.
    plan: 0.5c-512mb
    numInstances: 1 # rate limits are kept in memory per instance
    # Node version comes from .node-version (22.22.0)
    # devDependencies are needed to build (Nest CLI, TypeScript) and to migrate (Prisma CLI)
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Applies pending migrations (prisma migrate deploy: never resets, never drops data).
    # If it fails, Render keeps the previous version running.
    preDeployCommand: npm run render:predeploy
    startCommand: npm run render:start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      # ---------- runtime ----------
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      # ---------- database (Supabase > Connect; POOLER strings, not db.<ref>.supabase.co) ----------
      - key: DATABASE_URL # Transaction pooler, port 6543, append ?pgbouncer=true
        sync: false
      - key: DIRECT_URL # Session pooler, port 5432 (migrations)
        sync: false
      # ---------- auth ----------
      - key: JWT_SECRET
        generateValue: true # random 256-bit value created by Render (only on first creation)
      - key: JWT_EXPIRATION
        value: 1h
      - key: BCRYPT_ROUNDS
        value: "10"
      # ---------- Supabase Storage (private bucket project-documents) ----------
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # ---------- frontend / public URLs (non-secret; may stay empty until known) ----------
      - key: FRONTEND_ORIGIN # e.g. https://app.tammha.com
        sync: false
      - key: CORS_ORIGINS # optional extra origins, comma separated
        sync: false
      - key: INVITATION_LINK_BASE_URL # e.g. https://app.tammha.com/join
        sync: false
      - key: PUBLIC_BASE_URL # e.g. https://api.tammha.com once the custom domain works
        sync: false
      # ---------- HTTP security ----------
      - key: SWAGGER_ENABLED
        value: "true" # set "false" to hide /api/v1/docs in production
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      # Real client IP behind Render's edge. Confirm after the first deploy with
      # `npm run prod:verify` (client-IP check) — see the deployment guide.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      # ---------- LiveKit (meetings) ----------
      - key: LIVEKIT_ENABLED
        value: "true"
      - key: LIVEKIT_URL # wss://<project>.livekit.cloud
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # ---------- AI (Gemini, advisory only) ----------
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL # exact model ID from Google AI Studio
        sync: false
      # ---------- notifications ----------
      - key: REMINDERS_ENABLED
        value: "true"
      - key: EMAIL_ENABLED # e-mail provider adapters are not implemented yet
        value: "false"
      # ---------- free plan only ----------
      - key: MIGRATE_ON_START # "true" on the free plan (no preDeployCommand there)
        value: "false"
