# Render Blueprint — Tammha backend (NestJS + Prisma + Supabase PostgreSQL)
# Dashboard > New > Blueprint > select this repository. Render reads this file.
#
# Secrets use `sync: false`: Render asks for them in the Dashboard when the Blueprint
# is created (they are NEVER stored in this file). JWT_SECRET is generated by Render.
# Full guide: docs/STAGE_P15_RENDER_DEPLOYMENT.md
services:
  - type: web
    name: tammha-api
    runtime: node
    # Pick the region closest to your Supabase project (eu-central-1 = frankfurt).
    # Cannot be changed after creation.
    region: singapore
    # Plan shown is illustrative; review Render pricing/availability before use.
    # Do NOT enable MIGRATE_ON_START before migration review and a backup.
    plan: 0.5c-512mb
    numInstances: 1 # rate limits are kept in memory per instance
    # Node version comes from .node-version (22.22.0)
    # devDependencies are needed to build (Nest CLI, TypeScript) and to migrate (Prisma CLI)
    buildCommand: npm ci --include=dev && node scripts/assert-security-ready.js && npx prisma generate && npm run build
    # Pre-deploy migrations are intentionally DISABLED by default.
    # Migration 20261108120000_pre_integration_updates drops old grading columns.
    # Review existing DB, take a verified backup and manually approve/apply migrations
    # in a safe environment BEFORE enabling auto migrations.
    # preDeployCommand: npm run render:predeploy
    startCommand: npm run render:start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off # enable only after real-service verification
    envVars:
      # ---------- runtime ----------
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      # ---------- database (Supabase > Connect; POOLER strings, not db.<ref>.supabase.co) ----------
      - key: DATABASE_URL # Transaction pooler, port 6543, append ?pgbouncer=true
        sync: false
      - key: DIRECT_URL # Session pooler, port 5432 (migrations)
        sync: false
      # ---------- auth ----------
      - key: JWT_SECRET
        generateValue: true # random 256-bit value created by Render (only on first creation)
      - key: JWT_EXPIRATION
        value: 1h
      - key: BCRYPT_ROUNDS
        value: "10"
      # ---------- Supabase Storage (private bucket project-documents) ----------
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STUDENT_STORAGE_QUOTA_GB # per-student quota shared by all projects (1 GB = 1024^3 bytes)
        value: "10"
      - key: STORAGE_CLEANUP_INTERVAL_SECONDS # retry interval for failed Storage deletions
        value: "300"
      # ---------- frontend / public URLs (non-secret; may stay empty until known) ----------
      - key: FRONTEND_ORIGIN # e.g. https://tammha.site
        sync: false
      - key: CORS_ORIGINS # optional extra origins, comma separated
        sync: false
      - key: INVITATION_LINK_BASE_URL # e.g. https://tammha.site/join.html?code=
        sync: false
      - key: PUBLIC_BASE_URL # e.g. https://api.tammha.site once the custom domain works
        sync: false
      # ---------- HTTP security ----------
      - key: SWAGGER_ENABLED
        value: "false" # API docs disabled by default for production
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      # Real client IP behind Render's edge. Confirm after the first deploy with
      # `npm run prod:verify` (client-IP check) — see the deployment guide.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      # ---------- LiveKit (meetings) ----------
      - key: LIVEKIT_ENABLED
        value: "true"
      - key: LIVEKIT_URL # wss://<project>.livekit.cloud
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # ---------- AI (Gemini, advisory only) ----------
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL # exact model ID from Google AI Studio
        sync: false
      # ---------- notifications ----------
      - key: REMINDERS_ENABLED
        value: "true"
      # ---------- e-mail (SMTP; sends from the project mailbox) ----------
      # Set SMTP_HOST / SMTP_USER / SMTP_PASSWORD in the Dashboard BEFORE deploying: with
      # EMAIL_ENABLED=true the app refuses to start without them (Render keeps the old version).
      # Account e-mail verification is then required (EMAIL_VERIFICATION_REQUIRED follows EMAIL_ENABLED).
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST # IONOS: smtp.ionos.com (confirm in the IONOS panel)
        sync: false
      - key: SMTP_PORT # 587 = STARTTLS (required), 465 = TLS
        value: "587"
      - key: SMTP_USER # the sending mailbox: notifications@tammha.site
        sync: false
      - key: SMTP_PASSWORD # mailbox / app password from the mail provider
        sync: false
      - key: EMAIL_FROM # the official automated sender (= SMTP_USER mailbox)
        value: Tammha <notifications@tammha.site>
      - key: EMAIL_REPLY_TO
        value: support@tammha.site
      # ---------- migration safety ----------
      - key: MIGRATE_ON_START # KEEP false until DBA/owner approves migration plan
        value: "false"
      - key: TAMMHA_MIGRATIONS_REVIEWED # safety gate for manual predeploy, not a review substitute
        value: "false"
